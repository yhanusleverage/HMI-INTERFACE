; JC3248W535 — ESP32-S3 + IPS 3.5" 320x480 AXS15231B QSPI
; Manual similar JCZN: board "ESP32S3 Dev Module", Arduino-ESP32 ~3.0.2

[platformio]
; RX-TX bancada: UART logs. UI completa sin WiFi/SIM.
default_envs = esp32-s3-hmi-uart-bench

[env:esp32-s3-hmi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.psram_type = opi

lib_deps =
	lvgl/lvgl @ 8.3.11
	bblanchon/ArduinoJson @ ^7.2.1
	moononournation/GFX Library for Arduino @ 1.5.0

build_flags =
	-D CORE_DEBUG_LEVEL=3
	-D BOARD_HAS_PSRAM
	-D BOARD_JC3248W535=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D DATA_SOURCE_SIM=0
	-D UART_LINK_DEBUG=1
	-D DISP_SELFTEST=0
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I include

monitor_filters =
	esp32_exception_decoder

; Bancada RX-TX: sin WiFi STA ni Simulator; solo UART + UI + espejo
[env:esp32-s3-hmi-uart-bench]
extends = env:esp32-s3-hmi
build_flags =
	${env:esp32-s3-hmi.build_flags}
	-D UART_BENCH=1
	-D DATA_SOURCE_SIM=0

[env:esp32-s3-hmi-bringup]
extends = env:esp32-s3-hmi
build_flags =
	${env:esp32-s3-hmi.build_flags}
	-D UART_BRINGUP=1
	-D UART_LINK_DEBUG=1
